[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-validation-kit"
version = "0.1.0"
description = "The missing validation and reporting layer for credit risk models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Credit Risk Validation Kit Contributors" }]
keywords = ["credit-risk", "model-validation", "pd", "calibration", "psi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jinja2>=3.1",
  "loguru>=0.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
  "polars>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "typer>=0.12",
  "xgboost==2.1.4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pip-licenses>=5.0",
  "pre-commit>=3.7",
  "pyright>=1.1",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pip-licenses>=5.0",
  "pre-commit>=3.7",
  "pyright>=1.1",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
crvk = "credit_risk_validation.cli:app"

[project.urls]
Homepage = "https://github.com/LuisFigueroaG/credit-risk-validation-kit"
Repository = "https://github.com/LuisFigueroaG/credit-risk-validation-kit"
Issues = "https://github.com/LuisFigueroaG/credit-risk-validation-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_validation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["E501", "S101", "S105", "S404", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["credit_risk_validation"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
