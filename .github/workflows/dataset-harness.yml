name: Dataset Harness

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset key to run, or all
        required: true
        default: all
        type: choice
        options:
          - all
          - give_me_some_credit
          - default_credit_card_clients
          - home_credit_stability
      sample_size:
        description: Maximum rows per reference/current split
        required: true
        default: "5000"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - name: Run dataset harness
        run: >-
          uv run python scripts/run_all_dataset_harness.py
          --dataset "${{ inputs.dataset }}"
          --sample-size "${{ inputs.sample_size }}"
          --download
          --prepare
